version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tinolife-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinolife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinolife123}
      POSTGRES_DB: ${POSTGRES_DB:-tinolife}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tinolife-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tinolife}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tinolife-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - tinolife-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO 버킷 자동 생성
  createbuckets:
    image: minio/mc
    container_name: tinolife-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - tinolife-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/tinolife-images --ignore-existing;
      /usr/bin/mc anonymous set public myminio/tinolife-images;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinolife-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tinolife}:${POSTGRES_PASSWORD:-tinolife123}@db:5432/${POSTGRES_DB:-tinolife}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tinolife}:${POSTGRES_PASSWORD:-tinolife123}@db:5432/${POSTGRES_DB:-tinolife}
      POSTGRES_USER: ${POSTGRES_USER:-tinolife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinolife123}
      POSTGRES_DB: ${POSTGRES_DB:-tinolife}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      # MinIO 설정
      USE_S3: ${USE_S3:-true}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_S3_BUCKET: ${MINIO_BUCKET:-tinolife-images}
      AWS_S3_REGION: us-east-1
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
      - /app/.venv
    networks:
      - tinolife-network
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    entrypoint: ["/app/entrypoint.sh"]
    command: ["pipenv", "run", "uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  tinolife-network:
    driver: bridge
